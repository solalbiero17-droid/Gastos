name: Deploy web build to GitHub Pages

on:
  push:
    branches: [claude/react-native-firebase-app-b39yl3]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Export static web build
        env:
          # Served at github.io/<repo>/, not the domain root, so every asset
          # and route needs this prefix (see app.config.js).
          GH_PAGES_BASE_URL: /${{ github.event.repository.name }}
          EXPO_BASE_URL: /${{ github.event.repository.name }}
        run: npx expo export -p web
      - name: Add SPA fallback for direct/refreshed deep links
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
